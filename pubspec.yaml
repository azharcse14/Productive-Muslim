name: productive_muslim
description: "Productive Muslim — an offline-first, backend-less Islamic lifestyle app: prayer times, qibla, Quran, dua & tasbih, and the Muhasaba self-accountability tracker."

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.10.1

dependencies:
  adhan_dart: ^2.0.1
  crypto: ^3.0.7
  drift: ^2.34.0
  drift_flutter: ^0.3.0
  flutter:
    sdk: flutter
  flutter_local_notifications: ^22.0.1
  flutter_localizations:
    sdk: flutter
  geolocator: ^14.0.3
  get_it: ^9.2.1
  go_router: ^17.3.0
  intl: ^0.20.2
  local_auth: ^3.0.1
  path: ^1.9.1
  path_provider: ^2.1.5
  sensors_plus: ^7.0.0
  shared_preferences: ^2.5.5
  signals: ^7.1.0
  signals_flutter: ^7.1.0
  sqlite3: ^3.3.3
  timezone: ^0.11.0
  url_launcher: ^6.3.2

dev_dependencies:
  build_runner: ^2.15.0
  drift_dev: ^2.34.0
  flutter_launcher_icons: ^0.14.4
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  shared_preferences_platform_interface: ^2.4.2

flutter_launcher_icons:
  image_path: "assets/icon/productive_muslim_icon.png"
  android: true
  adaptive_icon_background: "#15564D"
  adaptive_icon_foreground: "assets/icon/productive_muslim_icon_foreground.png"
  adaptive_icon_monochrome: "assets/icon/productive_muslim_icon_monochrome.png"
  ios: true
  remove_alpha_ios: true
  web:
    generate: true
    background_color: "#15564D"
    theme_color: "#15564D"
  macos:
    generate: true

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/data/

  fonts:
    - family: SchibstedGrotesk
      fonts:
        - asset: assets/fonts/SchibstedGrotesk-Variable.ttf
    - family: NotoSansBengali
      fonts:
        - asset: assets/fonts/NotoSansBengali-Variable.ttf
    - family: IBMPlexSansArabic
      fonts:
        - asset: assets/fonts/IBMPlexSansArabic-Regular.ttf
        - asset: assets/fonts/IBMPlexSansArabic-Medium.ttf
          weight: 500
        - asset: assets/fonts/IBMPlexSansArabic-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/IBMPlexSansArabic-Bold.ttf
          weight: 700
    - family: UthmanicHafs
      fonts:
        - asset: assets/fonts/UthmanicHafs.ttf
