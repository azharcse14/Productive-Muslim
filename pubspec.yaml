name: qalbee
description: "Qalbee — an offline-first, backend-less Islamic lifestyle app: prayer times, qibla, Quran, dua & tasbih, and the Muhasaba self-accountability tracker."

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.10.1

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
