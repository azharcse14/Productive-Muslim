# This file configures the analyzer, which statically analyzes Dart code to
# =============================================================================
# analysis_options.yaml — Enterprise Ultra-Strict (Levels 1 → 7A-Hardcore)
# =============================================================================
# Philosophy:
# - Performance-first Flutter
# - Compile-time safety (almost no warnings)
# - Immutable state architecture (7A-Hardcore)
# =============================================================================

include: package:flutter_lints/flutter.yaml

linter:
  rules:
    # -------------------------------------------------------------------------
    # LEVEL 0: Your Overrides / Baseline
    # -------------------------------------------------------------------------
    prefer_is_empty: false
    avoid_print: false
    avoid_unnecessary_containers: true

    # -------------------------------------------------------------------------
    # LEVEL 1: General Code Quality & Safety
    # -------------------------------------------------------------------------
    prefer_const_constructors: true
    prefer_const_literals_to_create_immutables: true
    prefer_final_locals: true
    prefer_final_in_for_each: true
    unnecessary_this: true
    avoid_redundant_argument_values: true
    avoid_unnecessary_null_checks: true
    avoid_bool_literals_in_conditional_expressions: true
    always_declare_return_types: true
    avoid_dynamic_calls: true
    avoid_void_async: true
    no_leading_underscores_for_library_prefixes: true
    use_enums: true
    camel_case_types: true
    parameter_assignments: true

    # -------------------------------------------------------------------------
    # LEVEL 2: Readability, Structure & Consistency
    # -------------------------------------------------------------------------
    sort_child_properties_last: true
    sort_pub_dependencies: true
    directives_ordering: true
    # Keep long lines flexible for UI; use formatter for wrapping:
    lines_longer_than_80_chars: false
    require_trailing_commas: true
    sort_constructors_first: true
    sort_unnamed_constructors_first: true

    # -------------------------------------------------------------------------
    # LEVEL 3: Performance-Oriented (Render/Rebuild/GC)
    # -------------------------------------------------------------------------
    prefer_const_constructors_in_immutables: true
    prefer_const_declarations: true
    unnecessary_const: true
    avoid_unnecessary_rebuilds: true
    avoid_private_typedef_functions: true
    avoid_returning_widgets: true
    avoid_returning_null_for_future: true
    avoid_unnecessary_statements: true
    avoid_types_on_closure_parameters: true
    sized_box_for_whitespace: true
    use_colored_box: true
    use_decorated_box: true
    prefer_constructors_over_static_methods: true
    use_string_buffers: true
    use_to_and_as_if_applicable: true
    avoid_unnecessary_allocation: true
    avoid_multiple_declarations_per_line: true
    prefer_spread_collections: true
    prefer_inlined_adds: true
    # App-level perf habits
    use_list_view_separated: true
    avoid_single_child_scroll_view: true

    # -------------------------------------------------------------------------
    # LEVEL 4: Enterprise Performance Guardrails
    # -------------------------------------------------------------------------
    use_key_in_widget_constructors: true
    prefer_const_border_radius: true
    use_rethrow_when_possible: true
    avoid_double_and_int_checks: true
    avoid_multiple_widget_constructors: true
    avoid_nested_conditional_expressions: true
    prefer_if_null_operators: true

    # -------------------------------------------------------------------------
    # LEVEL 5: Strict Correctness (turn nearly everything to errors)
    # -------------------------------------------------------------------------
    unnecessary_parenthesis: true
    unnecessary_lambdas: true
    unnecessary_null_aware_assignments: true
    avoid_unnecessary_type_assertions: true
    avoid_null_checks_in_equality_operators: true
    avoid_setters_without_getters: true
    avoid_positional_boolean_parameters: true
    #    avoid_annotating_with_dynamic: true
    avoid_returning_this: true
    tighten_type_of_initializing_formals: true
    avoid_shadowing_type_parameters: true
    cancel_subscriptions: true
    avoid_slow_async_io: true
    #always_put_control_body_on_new_line: true
    unnecessary_await_in_return: true

    # -------------------------------------------------------------------------
    # LEVEL 6: Hardened Rules (API misuse, async leaks, hygiene)
    # -------------------------------------------------------------------------
    avoid_unnecessary_futures: true
    missing_whitespace_between_adjacent_strings: true
    literal_only_boolean_expressions: true
    no_adjacent_strings_in_list: true
    unnecessary_breaks: true
    #    unnecessary_final: true
    unnecessary_late: true
    unnecessary_to_list_in_spreads: true
    unnecessary_string_interpolations: true
    secure_pubspec_urls: true
    use_late_for_private_fields_and_variables: true
    use_raw_strings: true

    # -------------------------------------------------------------------------
    # LEVEL 7A-HARDCORE: Immutable State Architecture
    # NOTE: Enforces immutability patterns across state/domain layers.
    # -------------------------------------------------------------------------
    # Immutability & API discipline:
    avoid_init_to_null: true
    missing_enum_constant_in_switch: true
    exhaustive_cases: true
    prefer_expression_function_bodies: true
    # Discourage dynamic/implicit dynamic (strong typing everywhere):
    # (also reinforced in analyzer.errors below)
    # Encourage pattern matching (modern Dart control flow):
    prefer_pattern_matching: true

analyzer:
  # (These experiments were in your original file; keep as-is for compatibility)
  enable-experiment:
    - Records
    - Patterns
    - Sealed-classes

  # All important diagnostics as errors (super strict)
  errors:
    # --- From your base ---
    file_names: error
    library_prefixes: error
    non_constant_identifier_names: error
    invalid_assignment: error
    missing_return: error
    dead_code: error
    prefer_is_empty: error
    unused_local_variable: error
    dead_null_aware_expression: error
    deprecated_member_use: warning         # <— elevated to error (super strict)
    avoid_unnecessary_containers: error
    depend_on_referenced_packages: error
    library_private_types_in_public_api: error
    constant_identifier_names: warning     # <— elevated to error (super strict)
    use_super_parameters: error
    invalid_use_of_visible_for_testing_member: error
    avoid_renaming_method_parameters: error
    unnecessary_getters_setters: warning
    close_sinks: error
    missing_required_param: error
    record_literal_one_positional_no_trailing_comma: error
    collection_methods_unrelated_type: error
    unrelated_type_equality_checks: error

    #    # --- strictness you added ---
    invalid_use_of_protected_member: error
    missing_enum_constant_in_switch: error
    implicit_dynamic_type: error
    implicit_dynamic_parameter: error
    implicit_dynamic_map_literal: error
    implicit_dynamic_list_literal: error
    implicit_dynamic_function: error
    prefer_const_constructors: error
    unnecessary_await_in_return: error
    unawaited_futures: error
    always_put_control_body_on_new_line: error
    avoid_shadowing_type_parameters: error
    avoid_slow_async_io: error
    cancel_subscriptions: error
    tighten_type_of_initializing_formals: error
    #    unnecessary_lambdas: error
    unnecessary_parenthesis: error
    unnecessary_null_aware_assignments: error
    use_if_null_to_convert_nulls_to_bools: error
    use_named_constants: error
    ##    sort_constructors_first: error
    ##    sort_unnamed_constructors_first: error
    #    avoid_setters_without_getters: error
    #    avoid_positional_boolean_parameters: error
    avoid_unnecessary_type_assertions: error
    avoid_null_checks_in_equality_operators: error
    avoid_equals_and_hash_code_on_mutable_classes: error
    avoid_implementing_value_types: error
    #    avoid_function_literals_in_foreach_calls: error
    ##    avoid_annotating_with_dynamic: error
    avoid_returning_this: error

    #    # --- hardened set ---
    avoid_dynamic: error
    avoid_escaping_inner_quotes: error
    avoid_init_to_null: error
    avoid_multiple_animations: error
    #    prefer_expression_function_bodies: error
    avoid_redundant_argument_values: error
    avoid_types_on_closure_parameters: error
    avoid_unnecessary_futures: error
    avoid_void_async: error
    #    missing_whitespace_between_adjacent_strings: error
    literal_only_boolean_expressions: error
    no_adjacent_strings_in_list: error
    #    unnecessary_breaks: error
    #    #unnecessary_final: error
    unnecessary_late: error
    unnecessary_null_checks: error
    unnecessary_to_list_in_spreads: error
    unnecessary_string_interpolations: error
    prefer_const_border_radius: error
    secure_pubspec_urls: error
    use_late_for_private_fields_and_variables: error
    use_raw_strings: error
    exhaustive_cases: error
    prefer_pattern_matching: error

  exclude:
    - lib/*.g.dart
    - lib/*.frio.dart
    - lib/*.freezed.dart