# Productive Muslim analyzer configuration.
#
# Policy (docs/PRODUCTIVE_MUSLIM_DEVELOPMENT_GUIDE.md §6): flutter_lints latest, plus
# strict language modes. Zero analyzer warnings, zero deprecated API usage.

include: package:flutter_lints/flutter.yaml

analyzer:
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true
  errors:
    deprecated_member_use: error
    deprecated_member_use_from_same_package: error
    unawaited_futures: error
    discarded_futures: error
  exclude:
    - "**/*.g.dart"
    - "**/*.drift.dart"
    - "lib/core/l10n/gen/**"

linter:
  rules:
    # Async hygiene (guide §6: no unawaited futures, cancel everything)
    - unawaited_futures
    - discarded_futures
    - cancel_subscriptions
    - close_sinks
    - avoid_void_async

    # Typing & API discipline
    - always_declare_return_types
    - avoid_dynamic_calls
    - type_annotate_public_apis
    - prefer_final_locals
    - prefer_final_in_for_each

    # Const & immutability
    - prefer_const_constructors
    - prefer_const_constructors_in_immutables
    - prefer_const_declarations
    - prefer_const_literals_to_create_immutables

    # Style & consistency
    - directives_ordering
    - require_trailing_commas
    - sort_pub_dependencies
    - unnecessary_lambdas
    - unnecessary_parenthesis
    - avoid_redundant_argument_values
    - missing_whitespace_between_adjacent_strings
